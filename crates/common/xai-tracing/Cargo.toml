[package]
license = "Apache-2.0"
edition.workspace = true
name = "xai-tracing"
version = "0.1.0"

[features]
default = []
# Direct OTLP export + OpenTelemetry propagation (HTTP/gRPC inject, fastrace
# OTLP reporter). Fork slim leaves this off; product-full / hub-telemetry
# enable it when donation or export is wanted.
otlp = [
    "dep:fastrace-opentelemetry",
    "dep:fastrace-tonic",
    "dep:fastrace-reqwest",
    "dep:opentelemetry",
    "dep:opentelemetry-http",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tonic",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing-opentelemetry",
]

[dependencies]
async-trait = { workspace = true }
http = { workspace = true }
log = { workspace = true }
fastrace = { workspace = true }
fastrace-tonic = { workspace = true, optional = true }
fastrace-opentelemetry = { workspace = true, optional = true }
fastrace-reqwest = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true, features = ["testing"] }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true, optional = true }
tower = { workspace = true, optional = true, features = ["full"] }
tower-http = { workspace = true, optional = true, features = ["trace"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
# Tests that exercise OTLP inject need the feature.
xai-tracing = { path = ".", features = ["otlp"] }

[lints]
workspace = true
