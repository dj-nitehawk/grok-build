[package]
license = "Apache-2.0"
name = "xai-grok-extra-ca"
version = "0.1.0"
edition.workspace = true
description = "TLS policy for the grok CLI: rustls backend pin, process crypto provider, shared root store, and opt-in GROK_EXTRA_CA_BUNDLE roots"

[dependencies]
# The adapters promise OS trust plus the Mozilla bundle, so an unreadable OS
# store degrades rather than fails; both features must travel with this crate.
reqwest = { workspace = true, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
# Fork slim: extra-ca is the process TLS policy crate; pin ring, not aws-lc-rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = { workspace = true }
tracing = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
rcgen = { workspace = true }
# Explicit ring, so the preinstalled-provider test can install a second default.
rustls = { workspace = true, features = ["ring"] }
tempfile = { workspace = true }

[lints]
workspace = true
