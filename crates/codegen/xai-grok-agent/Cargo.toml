[package]
license = "Apache-2.0"
name = "xai-grok-agent"
version = "0.1.0"
edition.workspace = true
description = "Agent builder, definition parsing, and system prompt assembly"

[dependencies]
dunce = { workspace = true }
xai-grok-hooks = { path = "../xai-grok-hooks" }
xai-grok-sampling-types = { path = "../xai-grok-sampling-types" }
xai-grok-tools = { path = "../xai-grok-tools" }
xai-tty-utils = { workspace = true }
xai-token-estimation = { workspace = true }
minijinja = { version = "2", features = ["custom_syntax"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
ignore = { workspace = true }
xai-grok-config = { workspace = true }
xai-dirs = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"
xai-tool-types.workspace = true

[features]
default = []
default-bazel = []
# Forward tools LSP tool surface (registration + default toolset entry).
lsp = ["xai-grok-tools/lsp"]
# Forward tools WorkflowTool registration + agent toolset entries.
workflows = ["xai-grok-tools/workflows"]
# Forward memory_search / memory_get tool registration + toolset entries.
memory = ["xai-grok-tools/memory"]
# Forward web_fetch tool registration + toolset entries.
web-fetch = ["xai-grok-tools/web-fetch"]

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
