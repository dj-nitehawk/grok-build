[package]
license = "Apache-2.0"
name = "xai-grok-otel"
version = "0.1.0"
edition.workspace = true
description = "OpenTelemetry foundation for Grok Build: W3C trace-context propagation, the OTLP HTTP client, and the tracing->OTLP span layer/provider"
authors = ["xAI"]

[features]
default-bazel = []
# OTLP exporter + resource config. W3C traceparent minting stays compiled without
# this feature (non-exporting tracer). Fork slim leaves export off.
otel-context = ["dep:opentelemetry-http", "dep:opentelemetry-otlp"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-http = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
xai-grok-auth = { workspace = true }
xai-grok-extra-ca = { workspace = true }
xai-grok-env = { workspace = true, optional = true }
xai-grok-secrets = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
rcgen = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
