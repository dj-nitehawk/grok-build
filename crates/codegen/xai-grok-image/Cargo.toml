[package]
name = "xai-grok-image"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Image validation and transcoding shared by Grok tools and clients"

[features]
default = []
# GIF/WebP/BMP/TIFF/ICO. Off by default: this crate is always linked, and Cargo
# unifies `image` features, so enabling them here puts the decoders in the slim bin.
image-extra = ["image/gif", "image/webp", "image/bmp", "image/tiff", "image/ico"]

[dependencies]
crc32fast = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
thiserror = { workspace = true }

[dev-dependencies]
xai-test-utils = { workspace = true }

[lints]
workspace = true
