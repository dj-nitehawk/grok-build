[package]
license = "Apache-2.0"
name = "xai-grok-workspace-daemon"
version = "0.1.0"
edition.workspace = true
description = "Process lifecycle for the workspace-server daemon: self-daemonization, single-instance pidfile locking, and preview-proxy child supervision"

[dependencies]
clap = { workspace = true }
fs2 = { workspace = true }
prometheus = { workspace = true, optional = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
# Metric donation sink for the preview-proxy metrics scraper (feature `hub-telemetry`).
xai-computer-hub-sdk = { workspace = true }
# reset_oom_score_adj in the preview-proxy pre_exec hook.
xai-tty-utils = { workspace = true }

# fork/setsid/dup2/chdir on the self-daemonize path, and PDEATHSIG on the
# supervised preview-proxy child.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# SetStdHandle on the Windows self-daemonize path, plus the predecessor
# open/terminate calls behind the pidfile takeover.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[features]
default = []
# Local Prometheus families (ops scrape). Off for fork slim.
prometheus-metrics = ["dep:prometheus"]
# Hub metric donation for the preview-proxy scraper. Off for fork slim.
hub-telemetry = ["xai-computer-hub-sdk/metrics"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }

[lints]
workspace = true
