[package]
license = "Apache-2.0"
name = "xai-grok-workspace"
version = "0.1.220-alpha.4"
edition.workspace = true
description = "Core host-local workspace library (FS, VCS, execution, discovery) for xai-grok-shell and remote sampler"

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
dunce = { workspace = true }
xai-grok-version = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
dirs = "6"
parking_lot = { workspace = true }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
ignore = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
xai-grok-agent = { path = "../xai-grok-agent" }
xai-grok-tools = { path = "../xai-grok-tools" }
xai-grok-tools-api = { path = "../xai-grok-tools-api" }
# `DiagHandle`, held by the hub config and threaded through `connect_hub`.
# Diagnostics HTTP server (feature `diag-server`). Slim TUI leaves off.
xai-grok-diag-server = { workspace = true, optional = true }
xai-grok-workspace-client = { path = "../xai-grok-workspace-client" }
# Daemon/process-lifecycle machinery for `bin/workspace_server.rs` only.
# Optional; required-features on that bin. Slim TUI leaves off.
xai-grok-workspace-daemon = { path = "../xai-grok-workspace-daemon", optional = true }
xai-grok-workspace-types = { path = "../xai-grok-workspace-types" }
xai-grok-config = { workspace = true }
# Leaf config value types (RemoteSettings, BoolFlag) for the folder-trust decision.
xai-grok-config-types = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
dashmap = { workspace = true }
agent-client-protocol = { workspace = true }
xai-acp-lib = { workspace = true }
# Optional codebase graph (feature `codebase-graph`). Fork slim leaves off.
xai-codebase-graph = { path = "../xai-codebase-graph", optional = true }
xai-grok-paths = { path = "../xai-grok-paths" }
base64 = { workspace = true }
infer = { workspace = true }
sha2 = { workspace = true, features = ["force-soft"] }
bstr = "1.12.1"
hashbrown = "0.16.1"
nohash-hasher = "0.2.0"
rustc-hash = "2.1.1"
# Backs `file_system`'s fuzzy path picker (matcher + background daemon).
xai-fuzzy-file-search = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
smallvec = { workspace = true }
chrono = { workspace = true }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
url = { workspace = true }
xai-grok-env = { workspace = true }
humantime-serde = { workspace = true }
# Optional local Prometheus families (feature `prometheus-metrics`).
prometheus = { workspace = true, optional = true }
glob = "0.3"
xai-grok-sandbox = { path = "../xai-grok-sandbox", default-features = false }
xai-grok-hooks = { path = "../xai-grok-hooks" }
xai-hunk-tracker = { path = "../xai-hunk-tracker" }
# Hub OTLP donation (traces/logs/metrics) is feature `hub-telemetry` — off for
# fork slim so product binaries skip the OTel/proto stack. workspace_server
# enables it via product-full / --features hub-telemetry.
xai-computer-hub-sdk = { workspace = true }
xai-computer-hub-mcp-adapter = { path = "../../common/xai-computer-hub-mcp-adapter" }
xai-grok-mcp = { path = "../xai-grok-mcp" }
xai-file-utils = { path = "../xai-file-utils" }
xai-grok-session-events = { workspace = true }
xai-grok-auth = { path = "../xai-grok-auth" }
xai-grok-telemetry = { workspace = true }
xai-tty-utils = { workspace = true }
reqwest = { workspace = true }
xai-tool-protocol = { workspace = true }
xai-tool-runtime = { workspace = true }
xai-tool-types = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
urlencoding = "2"
xai-fast-worktree = { path = "../xai-fast-worktree", features = ["metadata"] }
# tonic: Status/Code mapping for deploy errors in workspace_ops.
tonic = { workspace = true }
sha1 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

xai-fsnotify = { path = "../xai-fsnotify" }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
# "enable" required for the SDK's spans to record at all.
fastrace = { workspace = true, features = ["enable"] }
xai-tracing = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tempfile = { workspace = true }
zstd = { workspace = true }
wait-timeout = { workspace = true }

# Raw fd/dirent/poll calls in foreign-session capability probes, the fuzzy
# walker's rlimit guard, and the envrc reader.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[[bin]]
name = "xai-workspace-server"
path = "src/bin/workspace_server.rs"
required-features = ["diag-server", "workspace-daemon"]

[[bin]]
name = "workspace-server-probe"
path = "src/bin/workspace_server_probe.rs"

[features]
default = ["sandbox-enforce"]
compression = []
test-support = []
test-util = []
sandbox-enforce = ["xai-grok-sandbox/enforce"]
# Hub WebSocket OTLP donation + xai-tracing OTLP + file-utils propagator.
# Off by default for slim product builds; enable for workspace_server donation.
hub-telemetry = [
    "xai-computer-hub-sdk/metrics",
    "xai-tracing/otlp",
    "xai-file-utils/otel-context",
    "xai-grok-workspace-daemon?/hub-telemetry",
]
# Local Prometheus metric families (ops scrape). Off for fork slim.
prometheus-metrics = ["dep:prometheus", "xai-grok-workspace-daemon?/prometheus-metrics"]
# Codebase graph index (multi-lang tree-sitter). Off for fork slim.
codebase-graph = ["dep:xai-codebase-graph"]
# Diagnostics HTTP server (workspace-server bin). Slim TUI leaves off.
diag-server = ["dep:xai-grok-diag-server"]
# Daemonize + preview supervisor (workspace-server bin). Slim TUI leaves off.
workspace-daemon = ["dep:xai-grok-workspace-daemon"]
default-bazel = [
    "sandbox-enforce",
    ]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
xai-test-utils = { path = "../../common/xai-test-utils" }
# Decode tar.gz archives produced by workspace upload helpers in tests.
flate2 = { workspace = true }
tar = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["tokio-tungstenite"]

[lints]
workspace = true
