[package]
license = "Apache-2.0"
name = "xai-grok-telemetry"
version = "0.1.0"
edition.workspace = true
description = "Telemetry engine: product events + Mixpanel emission + Sentry error reporting for Grok Build sessions"
authors = ["xAI"]

[features]
default = []
default-bazel = []
memory-log = []
# Sentry error reporting (panic/backtrace upload). Fork slim leaves this off.
export-sentry = ["dep:sentry"]
# Internal OTLP span layer + external customer OTEL stream (OTLP/logs/metrics).
# Fork slim leaves this off. Residual opentelemetry may still enter the product
# graph is optional via hub-telemetry / xai-tracing `otlp` / file-utils
# `otel-context` (default off on slim product-full path).
export-otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-http",
    "dep:webpki-roots",
    "dep:base64",
    "dep:http",
    "dep:bytes",
    "dep:async-trait",
    "dep:futures-executor",
    "dep:tokio-stream",
    "dep:tracing-opentelemetry",
]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2.4"
tracing-chrome = "0.7.2"
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
chrono = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
reqwest = { workspace = true }
url = { workspace = true }
xai-grok-env = { workspace = true }
xai-grok-secrets = { workspace = true }
xai-mixpanel = { workspace = true }
xai-grok-config = { workspace = true }
xai-grok-extra-ca = { workspace = true }
xai-grok-sampler = { workspace = true }
xai-token-estimation = { workspace = true }
dirs = { workspace = true }
# Optional: Sentry backends (feature `export-sentry`). Facade stays via stub.
sentry = { version = "0.42.0", default-features = false, optional = true, features = [
    "panic",
    "anyhow",
    "tracing",
    "backtrace",
    "contexts",
    "reqwest",
    "rustls",
    "debug-images",
] }
# Single cross-edge: `events::ToolCallCompleted.outcome` reuses
# `xai_grok_session_events::types::ToolOutcome` so the local event log and
# the product telemetry event share the same enum surface.
xai-grok-session-events = { workspace = true }
# `session_metrics::TraceUploadReason::from_upload_method` matches on the shared
# `UploadMethod` enum (small, dependency-light types crate) so the reason->wire
# mapping lives next to the trace-upload lifecycle events it labels.
xai-file-utils = { path = "../xai-file-utils" }
whoami = { workspace = true }
uuid = { workspace = true, features = ["v5", "v7"] }
obfstr = { workspace = true, optional = true }
mid = "4.0.0"
tokio = { workspace = true, features = ["macros", "sync", "rt", "time"] }
parking_lot = { workspace = true }
xai-grok-auth = { workspace = true }
# Optional OTEL export stack (feature `export-otel`). Stubs keep call sites.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true, features = [
    "experimental_logs_batch_log_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
    "rt-tokio-current-thread",
] }
# `tls-ring` compiles opentelemetry-otlp's TLS support for the gRPC
# transport. The workspace default is only `tls-roots`, which since otlp 0.32
# no longer implies a TLS provider feature — without one, every `https://`
# gRPC collector endpoint is rejected at exporter build time (GB-4580).
# ring matches the workspace tonic `tls-ring` + product rustls pin.
opentelemetry-otlp = { workspace = true, optional = true, features = ["tls-ring"] }
opentelemetry-http = { workspace = true, optional = true }
# Embedded Mozilla trust anchors for the gRPC TLS fallback: keeps `https://`
# collectors working on hosts with no readable system CA store (parity with
# the HTTP transport's embedded-roots reqwest client in `otlp_http.rs`).
webpki-roots = { workspace = true, optional = true }
# Re-encodes the validated GROK_EXTRA_CA_BUNDLE DERs as PEM for tonic's
# `Certificate::from_pem` (the gRPC transport's extra-CA parity with HTTP).
base64 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
futures-executor = { version = "0.3", optional = true }
tokio-stream = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
# Pre-main unified-log redirect for this crate's own test binary.
ctor = { workspace = true }
tonic = { workspace = true, features = ["transport"] }
# Self-signed CA + server cert for the TLS collector fixture
# (tests/external_otlp_grpc_tls.rs). `rustls` pins the process-default crypto
# provider there (ring-only workspace pin; install before acceptor setup).
rcgen = { workspace = true }
rustls = { workspace = true }
# In-memory log/metric exporters for the external-stream wire-shape tests.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# In-process OTLP collector fixture (tests/external_otlp.rs).
axum = { workspace = true }
axum-server = { workspace = true, features = ["tls-rustls"] }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
# Sets a symlink's own mtime (std's `set_modified` follows links) for prune tests.
filetime = { workspace = true }
futures-executor = "0.3"
tempfile = { workspace = true }

# OTLP wire tests need the real export backends (feature `export-otel`).
[[test]]
name = "external_otlp"
required-features = ["export-otel"]
[[test]]
name = "external_otlp_gates_on"
required-features = ["export-otel"]
[[test]]
name = "external_otlp_grpc"
required-features = ["export-otel"]
[[test]]
name = "external_otlp_guard"
required-features = ["export-otel"]
[[test]]
name = "external_otlp_session_ctx"
required-features = ["export-otel"]
[[test]]
name = "external_otlp_grpc_tls"
required-features = ["export-otel"]

[lints]
workspace = true
