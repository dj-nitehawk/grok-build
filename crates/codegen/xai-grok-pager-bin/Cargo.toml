[package]
name = "xai-grok-pager-bin"
version = "1.0.6"
edition.workspace = true
license = "Apache-2.0"
authors = ["xAI"]
default-run = "xai-grok-pager"

# Composition-root binary for the Grok Build TUI. The artifact is still named
# `xai-grok-pager`. This package exists so the binary can link both the pager
# library and the optional `xai-grok-pager-minimal` render mode: `minimal`
# depends on `xai-grok-pager`, so the pager library cannot depend back on it
# (cargo cycle). The binary installs the minimal-mode IoC hooks at startup.
[[bin]]
name = "xai-grok-pager"
path = "src/main.rs"

[dependencies]
# The pager library (all application logic + the public API main.rs drives).
xai-grok-pager = { path = "../xai-grok-pager" }
# Optional scrollback-native render mode (feature `pager-minimal`). Fork slim leaves off.
xai-grok-pager-minimal = { path = "../xai-grok-pager-minimal", optional = true }

# Agent runtime + leader/stdio/headless entry points.
xai-grok-shell = { workspace = true }
# Optional auto-update / version-policy path (feature `auto-update`). Slim leaves off.
xai-grok-update = { path = "../xai-grok-update", optional = true }
xai-grok-version = { workspace = true }
# Telemetry facade always; export backends via features (export-sentry / export-otel).
xai-grok-telemetry = { workspace = true }
xai-grok-workspace = { workspace = true }
# Always linked for TTY restore; crash blob install gated by `crash-report`.
xai-crash-handler = { path = "../xai-crash-handler" }
xai-acp-lib = { workspace = true }

# Async runtime + misc.
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tokio-util = { workspace = true, features = ["compat"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dunce = { workspace = true }
semver = { workspace = true }
xai-tty-utils = { workspace = true }
# `collect_crashed()` for the startup crash notice.
xai-grok-active-sessions = { workspace = true }
xai-grok-config = { workspace = true }
xai-grok-sandbox = { path = "../xai-grok-sandbox", default-features = false }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }

# Binary hardening: compile-time string + control-flow obfuscation.
obfstr = { workspace = true }
cryptify = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# Default allocator on Unix; gated by the `jemalloc` feature (see main.rs
# `#[global_allocator]`, cfg(all(feature = "jemalloc", unix))).
# `stats` is binary-scoped only (not workspace-wide) so this CLI jemalloc
# link gets --enable-stats for stats.allocated / stats.resident mallctl.
tikv-jemallocator = { workspace = true, optional = true, features = ["stats"] }
# Raw mallctl for the memory-cliff arena purge hook (see
# `purge_jemalloc_retained_pages` + the `install_release_hook` call in
# main.rs). Same version family as the
# allocator; adds no new build units beyond what tikv-jemallocator pulls in.
tikv-jemalloc-sys = { workspace = true, optional = true }
# Heap-profile / stats mallctl helpers (prof.active, prof.dump, epoch, stats.*).
tikv-jemalloc-ctl = { workspace = true, optional = true, features = ["stats", "use_std"] }

[dev-dependencies]
serial_test = { workspace = true }
# `PagerArgs::try_parse_from` in the CLI-parsing unit tests (needs the
# `clap::Parser` trait in scope).
clap = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }

[features]
# Fork slim defaults: no jemalloc / optional leaves. Capability features stay
# off until explicitly enabled; see .okf/fork-sync.md "Slim / strip policy".
# Use --features product-full or individual leaf features for a fat build.
default = [
    "sandbox-enforce",
    ]
default-bazel = [
    "sandbox-enforce",
    "local-workspace",
    ]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:tikv-jemalloc-ctl"]
sandbox-enforce = ["xai-grok-pager/sandbox-enforce"]
local-workspace = ["xai-grok-pager/local-workspace"]
release-dist = [
    "xai-grok-pager/release-dist",
    ]
# Sentry error reporting (forwards to telemetry export-sentry).
export-sentry = ["xai-grok-telemetry/export-sentry"]
# Internal OTLP + external customer OTEL stream (forwards to export-otel).
export-otel = ["xai-grok-telemetry/export-otel"]
# Crash blob install + previous-crash check. TTY restore always stays linked.
crash-report = []
# Scrollback-native minimal render mode (optional crate; fork does not use it).
pager-minimal = ["dep:xai-grok-pager-minimal"]
# Auto-update download/version-policy (optional xai-grok-update).
auto-update = ["dep:xai-grok-update", "xai-grok-pager/auto-update"]
# Plugin marketplace CLI/UI (forwards pager + shell).
marketplace = ["xai-grok-pager/marketplace"]
# Foreign session resume + Claude settings import (forwards pager + shell).
foreign-sessions = ["xai-grok-pager/foreign-sessions"]
# Meta-feature for a fat upstream-like build (opt-in; slim is default).
# Forwards leaf capability features through direct deps (shell/pager/telemetry).
product-full = [
    "jemalloc",
    "sandbox-enforce",
    "xai-grok-pager/mermaid",
    "xai-grok-pager/voice",
    "xai-grok-pager/image-extra",
    "xai-grok-pager/system-theme",
    "xai-grok-shell/workflows",
    "xai-grok-shell/memory",
    "xai-grok-shell/pdf",
    "xai-grok-shell/lsp",
    "xai-grok-shell/cloud-upload",
    "xai-grok-shell/hub-telemetry",
    "xai-grok-shell/image-extra",
    "xai-grok-shell/web-fetch",
    "xai-grok-shell/pptx",
    "xai-grok-shell/system-power",
    "xai-grok-shell/prometheus-metrics",
    "xai-grok-shell/codebase-graph",
    "export-sentry",
    "export-otel",
    "crash-report",
    # Phase 8 product surfaces (syntax stays on slim via fancy-regex; no gate).
    "pager-minimal",
    "auto-update",
    "marketplace",
    "foreign-sessions",
]
